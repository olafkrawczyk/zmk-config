CONFIG_ZMK_USB_LOGGING=n

CONFIG_ZMK_POINTING=y

# Deep sleep lives in totem_left.conf / totem_right.conf so the dongle
# (which shares this file) never sleeps: its mock kscan cannot wake it.

# Bluetooth stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=32
CONFIG_ZMK_BLE_CONSUMER_REPORT_QUEUE_SIZE=12
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=32
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=32
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=32
# Dongle central needs: 2 peripherals + 5 host profiles
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
