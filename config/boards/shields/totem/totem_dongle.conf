# Prospector dongle options (applies to the totem_dongle build only)
 
# Touchscreen: requires TP_* wires soldered (see module README).
# Swipe left/right to switch screens, up/down for brightness.
CONFIG_PROSPECTOR_TOUCHSCREEN=y
 
# Boot screen is Classic (the default). Operator (numeric WPM meter) is
# compiled in too — swipe left to reach it.
CONFIG_PROSPECTOR_SCREEN_OPERATOR_ENABLED=y
 
# No ambient light sensor populated: use fixed brightness
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
